<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorization Callback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0; display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb; color: #111827; transition: background 0.3s ease, color 0.3s ease;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #030712; color: #f9fafb; }
      .card { background: #111827; border-color: #374151; }
      .spinner { border-color: #374151; border-top-color: #6366f1; }
      p { color: #9ca3af; }
    }
    .card {
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 2.5rem; max-width: 360px; width: 90%; text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #e5e7eb;
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .card { animation: fadeIn 0.3s ease forwards; }
    p { font-size: 0.875rem; color: #6b7280; line-height: 1.5; }
    .logo-icon {
      width: 2.5rem; height: 2.5rem; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; box-shadow: 0 4px 12px rgba(99,102,241,0.2);
    }
    .logo-icon svg { width: 1.25rem; height: 1.25rem; color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-icon" aria-hidden="true">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    </div>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <p>Completing Facebook authorization...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var errorParam = params.get('error');
      var errorDescription = params.get('error_description');
      var OPENER_ORIGIN = window.location.origin;

      function closePopup(data) {
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage(data, OPENER_ORIGIN);
          } catch (e) {
            console.error('[FacebookCallback] postMessage failed:', e);
          }
        }
        setTimeout(function () { window.close(); }, 200);
      }

      function displayFallbackMessage(message) {
        document.body.innerHTML = '<div style="font-family:sans-serif;padding:2rem;max-width:500px;margin:0 auto;text-align:center;">' +
          '<h2 style="font-size:1.25rem;margin-bottom:0.75rem;">Facebook Authorization</h2>' +
          '<p style="color:#6b7280;margin-bottom:1rem;">' + escapeHtml(message) + '</p>' +
          '<p style="font-size:0.875rem;color:#9ca3af;">You can close this window.</p>' +
          '</div>';
      }

      function escapeHtml(s) {
        if (typeof s !== 'string') return '';
        return s.replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; });
      }

      if (errorParam) {
        closePopup({ type: 'facebook-error', error: errorDescription || errorParam });
        displayFallbackMessage(errorDescription || 'Facebook returned an error: ' + errorParam);
        return;
      }

      if (!code || !state) {
        var errMsg = 'Missing authorization code or state parameter. Please try connecting again.';
        closePopup({ type: 'facebook-error', error: errMsg });
        displayFallbackMessage(errMsg);
        return;
      }

      var expectedState = localStorage.getItem('facebook_oauth_state');
      localStorage.removeItem('facebook_oauth_state');

      if (!expectedState || state !== expectedState) {
        var errMsg = 'State mismatch — possible CSRF attack. Please try again.';
        closePopup({ type: 'facebook-error', error: errMsg });
        displayFallbackMessage(errMsg);
        return;
      }

      if (!window.opener || window.opener.closed) {
        displayFallbackMessage('The original dashboard window is no longer open. You can close this window and go back to the dashboard.');
        return;
      }

      (async function () {
        try {
          if (!window.opener.supabase || !window.opener.supabase.auth) {
            closePopup({ type: 'facebook-error', error: 'Supabase client not available in the parent window. Please refresh the dashboard and try again.' });
            return;
          }

          var sessionResult = await window.opener.supabase.auth.getSession();
          var session = sessionResult.data?.session;
          if (!session) {
            closePopup({ type: 'facebook-error', error: 'Your session has expired. Please sign in again and retry.' });
            return;
          }

          var jwt = session.access_token;
          if (!jwt) {
            closePopup({ type: 'facebook-error', error: 'No access token found in session. Please sign in again.' });
            return;
          }

          var edgeFunctionUrl = APP_CONFIG.FACEBOOK_EDGE_FUNCTION;

          if (!edgeFunctionUrl) {
            closePopup({ type: 'facebook-error', error: 'Facebook Edge Function URL is not configured in config.js.' });
            return;
          }

          console.log('[FacebookCallback] Calling Edge Function:', edgeFunctionUrl);

          var response = await fetch(edgeFunctionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + jwt
            },
            body: JSON.stringify({
              code: code,
              redirect_uri: APP_CONFIG.FACEBOOK_REDIRECT_URI
            })
          });

          if (!response.ok) {
            var errBody = '';
            try { errBody = await response.text(); } catch (_) {}
            var status = response.status;
            var msg = '';
            if (status === 401) {
              msg = 'Authentication failed (HTTP 401). Your session may have expired. Please refresh the dashboard and try again.';
            } else if (status === 500) {
              msg = 'The authentication server encountered an error (HTTP 500). The Edge Function may need configuration.';
            } else {
              msg = 'Token exchange failed (HTTP ' + status + '): ' + errBody;
            }
            console.error('[FacebookCallback] ' + msg);
            closePopup({ type: 'facebook-error', error: msg });
            return;
          }

          var result = null;
          try {
            result = await response.json();
          } catch (_) {}

          if (result && !result.success) {
            closePopup({ type: 'facebook-error', error: result.error || 'Edge Function returned an unsuccessful response.' });
            return;
          }

          console.log('[FacebookCallback] Edge Function returned OK');
          closePopup({ type: 'facebook-connected', success: true });
        } catch (err) {
          var msg = 'Cannot reach the authentication server. Make sure the Edge Function is deployed and the Supabase project is active.';
          if (err.name === 'TypeError' && err.message === 'Failed to fetch') {
            msg = 'Network error: Could not reach the Edge Function. Check your internet connection and that the function URL is correct.';
          } else if (err.message && err.message.indexOf('Failed to fetch') === -1) {
            msg = err.message;
          }
          console.error('[FacebookCallback] Error:', msg, err);
          closePopup({ type: 'facebook-error', error: msg });
        }
      })();
    })();
  </script>
</body>
</html>
